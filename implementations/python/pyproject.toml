[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "utv"
version = "0.2.0"
description = "Universal Temporal Value (UTV) 1.0: validation and the everyday API"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utv = ["data/*.json"]
