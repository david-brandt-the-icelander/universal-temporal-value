[package]
name = "utv"
version = "0.3.0"
edition = "2021"
description = "Universal Temporal Value (utv/1.0): typed dates, times, instants and periods with honest outcomes, over the JSON-level everyday API"
license-file = "../../LICENSE"

[features]
# Adapters for chrono's NaiveDate, NaiveTime, NaiveDateTime, DateTime<FixedOffset> and DateTime<Utc>
# (utv::interop::chrono). Off by default: the library's own dependencies stay serde_json, serde and regex.
chrono = ["dep:chrono"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
regex = "1"
chrono = { version = "0.4.38", optional = true }

[dev-dependencies]
# The example suites (tests/utv_first, tests/native_first) compare UTV with chrono and
# chrono-tz, because std has no calendar types. They need the `chrono` adapters, so the tests
# depend on this crate with that feature on: plain `cargo test` builds and runs them.
utv = { path = ".", features = ["chrono"] }
chrono = "0.4.38"
chrono-tz = "0.10"
