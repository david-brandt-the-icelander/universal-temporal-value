[package]
name = "utv"
version = "0.3.0"
edition = "2021"
description = "Universal Temporal Value (utv/1.0): typed dates, times, instants and periods with honest outcomes, over the JSON-level everyday API"
license-file = "../../LICENSE"

[features]
# Adapters for chrono's NaiveDate, NaiveTime, NaiveDateTime, DateTime<FixedOffset> and DateTime<Utc>
# (utv::interop::chrono). Off by default: the library's own dependencies stay serde_json, serde and regex.
chrono = ["dep:chrono"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
regex = "1"
chrono = { version = "0.4.38", optional = true }

[dev-dependencies]
# The "native" side of examples/everyday.rs and its test. std has no calendar types.
chrono = "0.4.38"
chrono-tz = "0.10"

[[example]]
name = "everyday"
required-features = ["chrono"]

# Snapshot test of the example. No libtest harness: it runs the example in a child process
# (itself, with an environment variable set) and compares the output with the snapshot.
[[test]]
name = "everyday_example"
required-features = ["chrono"]
harness = false
